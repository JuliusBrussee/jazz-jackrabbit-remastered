}
function drawMenu(items, x, y, gap = 13) {

const TITLE = {};
function titleItems() { return ['START GAME', 'LEVEL SELECT', 'CONTROLS', 'SOUND: ' + (AU.muted ? 'OFF' : 'ON'), 'FULLSCREEN']; }
function toggleFull() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => { }); }
function updateTitle() {
  if (G.state === 'title') {
    const sel = menuNav(5);

      sfx('select');

    }
  } else if (G.state === 'levels') {

    else if (sel) { if (G.menu < G.save.unlocked) { sfx('select'); const i = G.menu; transition(() => { newGame(); startLevel(i); }); } else sfx('hurt'); }
  } else if (hit('start') || hit('pause') || hit('jump') || IN.clicked) { G.state = 'title'; G.menu = 2; sfx('select'); }
}
function drawLogo(cx, y) {
  const word = 'JAZZ', sc = 6, w = tw(word, sc);
  for (let i = 0; i < 4; i++) {
    const x = cx - w / 2 + i * 6 * sc, yy = y + Math.round(Math.sin(G.t * .06 + i * .8) * 3);
    for (let d = 5; d >= 1; d--) text(ctx, word[i], x + d, yy + d, { col: d > 2 ? '#3a0606' : '#8a1a0a', ol: null, scale: sc });

  text(ctx, 'JACKRABBIT', cx + 2, y + 52, { col: '#06280a', ol: null, scale: 3, align: 'center' });
  text(ctx, 'JACKRABBIT', cx, y + 50, { col: JADE, ol: '#041a06', scale: 3, align: 'center' });

}
function renderTitle() {
  const th = THEMES.diamondus, t = G.t;

  ctx.setTransform(SC, 0, 0, SC, 0, 0);

  const fr = SPR.jazz.sprint[(t >> 2) % 8];

function updatePause() {

  drawMenu(['RESUME', 'RESTART LEVEL', 'SOUND: ' + (AU.muted ? 'OFF' : 'ON'), 'QUIT TO TITLE'], VW / 2, VH * .26 + 40);
}
function updateResults() {
  const R = G.res; G.rt++;
  const go = hit('start') || hit('jump') || IN.clicked;
  if (!R.done) {
    if (G.rt % 26 === 0 && R.shown < R.rows.length) { R.shown++; sfx('select'); }
    if (R.shown === R.rows.length) { const d = Math.min(Math.max(50, Math.ceil(R.total / 70)), R.total - R.tally); if (d > 0) { R.tally += d; G.score += d; if (G.rt % 3 === 0) sfx('tick'); } else { R.done = true; sfx('check'); } }
    if (go && G.rt > 10) { G.score += R.total - R.tally; R.tally = R.total; R.shown = R.rows.length; R.done = true; }
  } else if (go) {
    G.shown = G.score; const next = G.level + 1;
    G.save.unlocked = Math.max(G.save.unlocked, Math.min(5, next + 1)); G.save.best = Math.max(G.save.best, G.score); writeSave();

}
function renderResults() {
  const R = G.res, th = L.theme;
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  ctx.fillStyle = 'rgba(4,2,16,.6)'; ctx.fillRect(0, 0, VW, VH);

  });

function renderGameOver() {

function updateEnding() {

    const x = rnd(VW * .12, VW * .88), y = rnd(VH * .08, VH * .4), col = pick(['255,90,200', '90,220,255', '255,220,90', '140,255,120', '255,140,80']);
    for (let i = 0; i < 44; i++) { const a = i / 44 * TAU, s = rnd(1, 2.6); G.fw.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(40, 75), max: 75, col }); }

function renderEnding() {

function drawIris() {
  if (!G.tr) return;

  let x = VW / 2, y = VH / 2;
  if (L && P && (G.state === 'play' || G.state === 'results')) { x = P.x + P.w / 2 - cam.x; y = P.y + P.h / 2 - cam.y; }
  const R = Math.hypot(VW, VH) * Math.max(0, v);
  ctx.setTransform(SC, 0, 0, SC, 0, 0); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.arc(x, y, R, 0, TAU, true); ctx.fill('evenodd');
}

// ───────────────────────────── main loop ─────────────────────────────
function update() {
  G.t++;
  if (hit('mute')) setMuted(!AU.muted);
  if (hit('full')) toggleFull();
  if (G.tr) { G.tr.t++; if (G.tr.t >= 24) { if (G.tr.out) { const f = G.tr.fn; G.tr.out = 0; G.tr.t = 0; f(); } else G.tr = null; } if (G.tr && G.tr.out) return; }
  switch (G.state) {
    case 'title': case 'levels': case 'controls': updateTitle(); break;
    case 'play':
      if (hit('pause') && !P.dead && !P.win) { G.state = 'pause'; G.menu = 0; sfx('select'); copterSound(false); break; }
      updateWorld();
      if (G.intro > 0) G.intro--; if (G.msg && --G.msg.t <= 0) G.msg = null; if (G.wT > 0) G.wT--;

      break;
    case 'pause': updatePause(); break;
    case 'results': updateResults(); G.shown = G.score; for (const p of L.parts) p.life--; L.parts = L.parts.filter(p => p.life > 0); break;
    case 'gameover': if (G.t > 60 && (hit('start') || hit('jump') || IN.clicked)) transition(() => { newGame(); startLevel(G.level); }); break;
    case 'ending': updateEnding(); break;

}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
  cv.style.cursor = G.state === 'play' ? 'none' : 'default';
  switch (G.state) {
    case 'title': case 'levels': case 'controls': renderTitle(); break;
    case 'play': renderGame(); break;
    case 'pause': renderGame(); renderPause(); break;
    case 'results': renderGame(); renderResults(); break;

}
let last = performance.now(), acc = 0;
function frame(now) {

  acc += Math.min(100, now - last); last = now;
  let n = 0;
  while (acc >= 1000 / 60 && n < 4) { pollInput(); update(); acc -= 1000 / 60; n++; }
  if (n === 4) acc = 0;
  render();
}
function teleport(col) {

}
function boot() {

  const th = THEMES.diamondus; TITLE.strip = mk(256, 34);
  { const g = TITLE.strip.getContext('2d'), id = g.createImageData(256, 34); for (let y = 0; y < 34; y++) for (let x = 0; x < 256; x++) { const gh = 6 + ((hash2(x >> 1, 0, 5) * 2.2) | 0); let c; if (y < gh) c = y === 0 ? th.top[0] : th.top[clamp(Math.floor((y + dith(x, y) * 1.4) * 5 / gh), 1, 4)]; else { const ti = ((y + 40) * 256 + x) * 3; c = [th.tex[ti], th.tex[ti + 1], th.tex[ti + 2]]; if (y < gh + 2) c = shd(c, -.4); } const i = (y * 256 + x) * 4; id.data[i] = c[0]; id.data[i + 1] = c[1]; id.data[i + 2] = c[2]; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); }
